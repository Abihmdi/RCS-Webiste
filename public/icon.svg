<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <!-- Subtle glowing circle behind the letter -->
  <circle cx="256" cy="256" r="140" fill="#C3E633" opacity="0.08" filter="blur(30px)"/>
  <!-- Premium letter 'R' styled as font (Bebas Neue vibe) -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="260" 
        fill="#FFFFFF" 
        text-anchor="middle"
        style="letter-spacing: -0.05em;">R</text>
  <!-- Accent dot matching the RCS. logo style -->
  <circle cx="345" cy="305" r="22" fill="#C3E633"/>
</svg>