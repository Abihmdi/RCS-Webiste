<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#141415"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ECFF8A;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ECFF8A;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Logo text -->
  <text x="100" y="200" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="6" fill="white">RCS<tspan fill="#ECFF8A">.</tspan></text>
  <!-- Tagline -->
  <text x="100" y="290" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="2">PROVIDING VALUABLE RESULTS</text>
  <!-- Description -->
  <text x="100" y="360" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="rgba(255,255,255,0.5)">Digital Transformation Agency — Web, Mobile, ERP &amp; AI Solutions</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(236,255,138,0.06)"/>
  <text x="100" y="612" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.4)" letter-spacing="3">ruangciptasolusi.com</text>
  <!-- Accent line -->
  <rect x="100" y="240" width="80" height="3" rx="1.5" fill="#ECFF8A"/>
</svg>
